name: Deploy Behavior Tracker website

on:
  push:
    branches: [main]
    paths:
      - 'src/features/web/**'
      - 'src/features/auth/**'
      - 'src/features/colab/connection.ts'
      - 'src/components/ui/**'
      - 'src/store/**'
      - 'src/lib/utils.ts'
      - 'src/lib/format.ts'
      - 'src/lib/demo-data.ts'
      - 'src/lib/geometry.ts'
      - 'src/lib/session-cache.ts'
      - 'src/main.tsx'
      - 'src/App.tsx'
      - 'src/styles.css'
      - 'src/types.ts'
      - 'src/vite-env.d.ts'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'tsconfig.node.json'
      - 'docker-compose.live.yml'
      - 'scripts/deploy-live.sh'
      - '.github/workflows/deploy-web.yml'
      - '.github/workflows/quality.yml'
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Optional successful installer build ID for this same commit; leave empty to run quality"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: behaviortracker-web-production
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      source_run_id: ${{ inputs.source_run_id || '' }}

  deploy:
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
      DEPLOY_USER: deploy
      DEPLOY_ROOT: /srv/apps/.behaviortracker-deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify website files
        shell: bash
        run: |
          set -euo pipefail
          for page in index.html privacy/index.html terms/index.html legal.css; do
            test -s "dist/$page"
          done

      - name: Configure SSH
        shell: bash
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          VPS_DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_DEPLOY_SSH_KEY"
          test -n "$DEPLOY_HOST"
          test -n "$VPS_DEPLOY_KNOWN_HOSTS"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Upload tested website
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_ROOT/incoming/$GITHUB_SHA'"
          rsync -az --delete -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes' dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/incoming/$GITHUB_SHA/"

      - name: Update repository and publish website
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$DEPLOY_ROOT/deploy.sh' '$GITHUB_SHA'"
