name: Build desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: macos-intel
            output: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: macos-apple-silicon
            output: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: windows-x64
            output: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage
            artifact: linux-x64
            output: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.runner }}
    env:
      BEHAVETRACKER_TARGET: ${{ matrix.target }}
      BEHAVETRACKER_REQUIRE_STATIC: "1"
      BEHAVETRACKER_GOOGLE_CLIENT_ID: 60117059630-9v3c4cv8dpb7iacag7qrkrhs6kilvh9t.apps.googleusercontent.com
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf xdg-utils libfuse2 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Prepare bundled FFmpeg and ffprobe
        shell: bash
        run: |
          npm install --no-save --no-package-lock ffmpeg-static@5.3.0 @derhuerst/ffprobe-static@5.3.0
          node scripts/prepare-video-tools.mjs

      - name: Download the pinned model bundle
        shell: bash
        run: |
          gh release download models-wistar-df-v2-r1 \
            --repo CodesOfGabriel/behaviortracker \
            --dir models/wistar_df_v2 \
            --pattern best_detector.pth \
            --pattern snapshot-hrnet_w32-001.pt
          node scripts/check-release-models.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Build installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci

      - name: Verify Linux bundles
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          shopt -s nullglob
          debs=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb)
          appimages=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          test ${#debs[@]} -gt 0
          test ${#appimages[@]} -gt 0

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7
