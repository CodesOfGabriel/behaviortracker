name: Required quality checks

on:
  workflow_call:
    inputs:
      source_run_id:
        description: "Optional successful installer build for this exact commit"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  reuse:
    name: Reuse validated installer build
    if: inputs.source_run_id != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - name: Verify successful build and quality for this exact commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid run ID" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e --arg sha "$GITHUB_SHA" '
            .status == "completed" and
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $sha and
            .path == ".github/workflows/build-installers.yml"
          ' source-run.json > /dev/null
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > source-jobs.json
          jq -e '
            [.[].jobs[] | select(.status == "completed" and .conclusion == "success") | .name] as $passed |
            all(["Quality (ubuntu-22.04)", "Quality (macos-15-intel)", "Quality (windows-latest)"][];
              . as $required | any($passed[]; endswith($required)))
          ' source-jobs.json > /dev/null
          echo "Reusing quality from installer build $SOURCE_RUN_ID for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality (${{ matrix.os }})
    if: inputs.source_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/quality/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: |
          python -m pip install --only-binary=:all: -r scripts/quality/requirements.txt
      - name: Install Chromium and WebKit
        if: runner.os != 'Windows'
        run: npx playwright install --with-deps chromium webkit
      - name: Install Chromium and Edge for Windows WebView2 coverage
        if: runner.os == 'Windows'
        run: npx playwright install chromium msedge
      - name: Prepare isolated native video tools
        shell: bash
        run: |
          export BEHAVETRACKER_VIDEO_TOOLS_DIR="$RUNNER_TEMP/behavetracker-video-tools"
          echo "BEHAVETRACKER_VIDEO_TOOLS_DIR=$BEHAVETRACKER_VIDEO_TOOLS_DIR" >> "$GITHUB_ENV"
          npm install --prefix "$BEHAVETRACKER_VIDEO_TOOLS_DIR" --no-package-lock --no-audit --no-fund ffmpeg-static@5.3.0 @derhuerst/ffprobe-static@5.3.0
          node scripts/prepare-video-tools.mjs
      - name: Run mandatory application checks
        run: npm run verify
        env:
          BEHAVETRACKER_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          # Synthetic credentials exercise compile-time OAuth in tests. The
          # installer job separately requires the real repository secret.
          BEHAVETRACKER_GOOGLE_CLIENT_ID: fixture-desktop.apps.googleusercontent.com
          BEHAVETRACKER_GOOGLE_CLIENT_SECRET: fixture-google-client-secret
      - name: Retain evidence when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-failure-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
