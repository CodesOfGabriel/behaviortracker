[package]
name = "behavetracker"
version = "0.1.0"
description = "Desktop behavioral tracking review for open field experiments"
authors = ["BehaveTracker contributors"]
edition = "2021"

[lib]
name = "behavetracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.8"
reqwest = { version = "0.13", features = ["blocking", "form", "json", "query"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.7.1"
url = "2.5"

